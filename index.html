<!DOCTYPE html><html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顏色挑選器</title>
<style>
  :root{
    --base:#1a1a1d;
    --bg:#111113;
    --panel:#1a1a1d;
    --panel2:#232328;
    --text:#f4f4f5;
    --muted:#a1a1aa;
    --border:#33333a;
    --shadow:0 14px 36px rgba(0,0,0,.35);
    --radius:18px;
  }*{box-sizing:border-box} html,body{height:100%} body{ margin:0; background:radial-gradient(900px 500px at 50% -160px,#2b2b31 0%,var(--bg) 58%,#0d0d0f 100%); color:var(--text); font:16px/1.5 ui-sans-serif,-apple-system,"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial; }

.wrap{max-width:520px;margin:24px auto 80px;padding:0 16px} .panel{ background:var(--panel); border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow); overflow:hidden; }

header{text-align:center;padding:18px 16px 8px} .title{font-weight:900;letter-spacing:.4px;font-size:20px}

.section{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 16px 22px}

.preview{ width:220px; height:120px; border-radius:18px; border:1px solid var(--border); box-shadow:var(--shadow); background:#85875d; }

.sv-wrap{position:relative;width:280px;height:180px;touch-action:none} #sv{ width:100%;height:100%;display:block; border-radius:16px; border:1px solid var(--border); box-shadow:var(--shadow); background:#fff; } .sv-cursor{ position:absolute;width:20px;height:20px; border-radius:999px; border:3px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.45); pointer-events:none; transform:translate(-10px,-10px); }

.hue-wrap{width:280px;height:28px;display:flex;align-items:center} #hue{ appearance:none;-webkit-appearance:none; width:100%;height:16px; border-radius:999px; outline:none; border:1px solid var(--border); background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); box-shadow:var(--shadow); } #hue::-webkit-slider-thumb{ -webkit-appearance:none;appearance:none; width:24px;height:24px;border-radius:999px; background:#fff;border:2px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.45); } #hue::-moz-range-thumb{ width:24px;height:24px;border-radius:999px; background:#fff;border:2px solid #fff; box-shadow:0 0 0 2px rgba(0,0,0,.45); }

.hex-box{width:280px;display:grid;gap:8px} .hex-label{color:var(--muted);font-size:13px;font-weight:700;text-align:center} #hexInput{ width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:12px 14px; text-align:center; font-size:20px; font-weight:900; letter-spacing:.08em; outline:none; text-transform:uppercase; } #hexInput:focus{border-color:#71717a}

.btn{ appearance:none; border:1px solid var(--border); border-radius:16px; padding:12px 18px; font-weight:900; color:var(--text); background:linear-gradient(180deg,#2f2f35,#232328); box-shadow:var(--shadow); cursor:pointer; } .btn:active{transform:translateY(1px)}

.toast{ position:fixed;left:50%;bottom:18px; transform:translateX(-50%); background:#f4f4f5;color:#111113; padding:8px 12px;border-radius:999px; opacity:0;pointer-events:none;transition:.2s; font-weight:800; } .toast.show{opacity:1}

@media(max-width:360px){ .sv-wrap,.hue-wrap,.hex-box{width:240px} .sv-wrap{height:160px} .preview{width:200px;height:110px} } </style>

</head>
<body>
  <div class="wrap">
    <div class="panel">
      <header>
        <div class="title">顏色挑選器</div>
      </header><section class="section">
    <div id="preview" class="preview" aria-label="預覽色塊"></div>

    <div class="sv-wrap" id="svWrap" aria-label="彩度與明度調整方塊">
      <canvas id="sv"></canvas>
      <div id="svCursor" class="sv-cursor" aria-hidden="true"></div>
    </div>

    <div class="hue-wrap">
      <input id="hue" type="range" min="0" max="360" value="63" aria-label="色相">
    </div>

    <div class="hex-box">
      <div class="hex-label">HEX</div>
      <input id="hexInput" value="#85875D" maxlength="7" spellcheck="false" aria-label="HEX 顏色輸入">
    </div>

    <button id="random" class="btn">隨機顏色</button>
  </section>
</div>

  </div>  <div id="toast" class="toast" role="status" aria-live="polite">HEX 格式錯誤</div><script>
(function(){
  const $=s=>document.querySelector(s);
  const hsv={h:63,s:0.31,v:0.53};

  const sv=$('#sv');
  const svWrap=$('#svWrap');
  const svCursor=$('#svCursor');
  const hue=$('#hue');
  const preview=$('#preview');
  const hexInput=$('#hexInput');
  const toast=$('#toast');

  function clamp(n,min,max){return Math.min(max,Math.max(min,n));}

  function hsvToRgb(h,s,v){
    const c=v*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=v-c;
    let r=0,g=0,b=0;
    if(0<=h&&h<60){r=c;g=x;b=0;}
    else if(60<=h&&h<120){r=x;g=c;b=0;}
    else if(120<=h&&h<180){r=0;g=c;b=x;}
    else if(180<=h&&h<240){r=0;g=x;b=c;}
    else if(240<=h&&h<300){r=x;g=0;b=c;}
    else{r=c;g=0;b=x;}
    return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)};
  }

  function rgbToHex(r,g,b){
    const toHex=n=>n.toString(16).padStart(2,'0');
    return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
  }

  function hexToRgb(hex){
    let h=(hex||'').trim().replace('#','');
    if(h.length===3) h=h.split('').map(x=>x+x).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    const n=parseInt(h,16);
    return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
  }

  function rgbToHsv(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
    let h=0,s=max===0?0:d/max,v=max;
    if(d!==0){
      if(max===r) h=60*(((g-b)/d)%6);
      else if(max===g) h=60*((b-r)/d+2);
      else h=60*((r-g)/d+4);
    }
    if(h<0) h+=360;
    return {h,s,v};
  }

  function drawSV(){
    const ctx=sv.getContext('2d');
    const w=sv.width=sv.clientWidth;
    const h=sv.height=sv.clientHeight;

    const pure=hsvToRgb(hsv.h,1,1);
    ctx.fillStyle=`rgb(${pure.r},${pure.g},${pure.b})`;
    ctx.fillRect(0,0,w,h);

    const white=ctx.createLinearGradient(0,0,w,0);
    white.addColorStop(0,'#ffffff');
    white.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=white;
    ctx.fillRect(0,0,w,h);

    const black=ctx.createLinearGradient(0,0,0,h);
    black.addColorStop(0,'rgba(0,0,0,0)');
    black.addColorStop(1,'#000000');
    ctx.fillStyle=black;
    ctx.fillRect(0,0,w,h);

    svCursor.style.left=`${hsv.s*w}px`;
    svCursor.style.top=`${(1-hsv.v)*h}px`;
  }

  function updateOutputs(){
    const {r,g,b}=hsvToRgb(hsv.h,hsv.s,hsv.v);
    const hex=rgbToHex(r,g,b);
    preview.style.background=hex;
    hexInput.value=hex;
    hue.value=Math.round(hsv.h);
    drawSV();
  }

  function setFromHex(hex){
    const rgb=hexToRgb(hex);
    if(!rgb){showToast('HEX 格式錯誤');return;}
    const next=rgbToHsv(rgb.r,rgb.g,rgb.b);
    hsv.h=next.h;
    hsv.s=next.s;
    hsv.v=next.v;
    updateOutputs();
  }

  function xyToSV(clientX,clientY){
    const rect=sv.getBoundingClientRect();
    const x=clamp(clientX-rect.left,0,rect.width);
    const y=clamp(clientY-rect.top,0,rect.height);
    hsv.s=x/rect.width;
    hsv.v=1-y/rect.height;
    updateOutputs();
  }

  let dragging=false;
  function startDrag(e){
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    xyToSV(p.clientX,p.clientY);
  }
  function moveDrag(e){
    if(!dragging)return;
    const p=e.touches?e.touches[0]:e;
    xyToSV(p.clientX,p.clientY);
    e.preventDefault();
  }
  function endDrag(){dragging=false;}

  svWrap.addEventListener('mousedown',startDrag);
  window.addEventListener('mousemove',moveDrag);
  window.addEventListener('mouseup',endDrag);
  svWrap.addEventListener('touchstart',startDrag,{passive:false});
  window.addEventListener('touchmove',moveDrag,{passive:false});
  window.addEventListener('touchend',endDrag);

  hue.addEventListener('input',()=>{
    hsv.h=Number(hue.value);
    updateOutputs();
  });

  hexInput.addEventListener('input',()=>{
    const raw=hexInput.value.trim();
    const valid=/^#?[0-9a-fA-F]{6}$/.test(raw) || /^#?[0-9a-fA-F]{3}$/.test(raw) || raw==='' || raw==='#';
    hexInput.style.borderColor=valid?'var(--border)':'#ef4444';
  });

  function commitHexInput(){
    const raw=hexInput.value.trim();
    if(/^#?[0-9a-fA-F]{6}$/.test(raw) || /^#?[0-9a-fA-F]{3}$/.test(raw)){
      setFromHex(raw);
      hexInput.style.borderColor='var(--border)';
    }else{
      hexInput.value=rgbToHex(...Object.values(hsvToRgb(hsv.h,hsv.s,hsv.v)));
      hexInput.style.borderColor='var(--border)';
      showToast('HEX 格式錯誤');
    }
  }

  hexInput.addEventListener('change',commitHexInput);
  hexInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      hexInput.blur();
      commitHexInput();
    }
  });

  $('#random').addEventListener('click',()=>{
    hsv.h=Math.floor(Math.random()*360);
    hsv.s=+(0.35+Math.random()*0.6).toFixed(2);
    hsv.v=+(0.45+Math.random()*0.5).toFixed(2);
    updateOutputs();
  });

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),1200);
  }

  window.addEventListener('resize',drawSV);
  updateOutputs();
})();
</script></body>
</html>
