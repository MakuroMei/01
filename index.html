<!doctype html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Video Crop Join Tool</title>
  <style>
    :root{--bg:#0f1117;--panel:#171b23;--panel2:#1e2430;--border:#2a3242;--text:#eef2ff;--muted:#9aa4bd;--green:#10b981;--blue:#3b82f6;--red:#ef4444}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:14px;display:grid;gap:14px}
    .panel{background:var(--panel);border:1px solid var(--border);padding:12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
    label{font-size:12px;color:var(--muted);display:grid;gap:4px}
    input,select,button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px;font-size:14px}
    button{cursor:pointer;font-weight:800}.primary{background:var(--blue)}.success{background:var(--green)}.danger{background:var(--red)}
    video,canvas{width:100%;background:#000;display:block;border:1px solid var(--border)}
    .preview-wrap{display:grid;gap:10px}.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.topbar > *{flex:1}.small{font-size:12px;color:var(--muted);line-height:1.5}.out{display:grid;gap:10px}.hidden{display:none}
    @media(max-width:850px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel topbar">
      <label>影片 A<input id="fileA" type="file" accept="video/*"></label>
      <label>影片 B<input id="fileB" type="file" accept="video/*"></label>
      <label>拼接方向
        <select id="mode">
          <option value="horizontal">左右拼接</option>
          <option value="vertical">上下拼接</option>
        </select>
      </label>
      <label>輸出 FPS<input id="fps" type="number" min="10" max="60" value="30"></label>
    </div><div class="grid">
  <div class="panel">
    <div class="preview-wrap">
      <video id="videoA" controls muted playsinline></video>
      <div class="controls">
        <label>X %<input id="ax" type="number" value="0" min="0" max="100"></label>
        <label>Y %<input id="ay" type="number" value="0" min="0" max="100"></label>
        <label>寬 %<input id="aw" type="number" value="100" min="1" max="100"></label>
        <label>高 %<input id="ah" type="number" value="100" min="1" max="100"></label>
        <label>左右鏡像<input id="afh" type="checkbox"></label>
        <label>上下鏡像<input id="afv" type="checkbox"></label>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="preview-wrap">
      <video id="videoB" controls muted playsinline></video>
      <div class="controls">
        <label>X %<input id="bx" type="number" value="0" min="0" max="100"></label>
        <label>Y %<input id="by" type="number" value="0" min="0" max="100"></label>
        <label>寬 %<input id="bw" type="number" value="100" min="1" max="100"></label>
        <label>高 %<input id="bh" type="number" value="100" min="1" max="100"></label>
        <label>左右鏡像<input id="bfh" type="checkbox"></label>
        <label>上下鏡像<input id="bfv" type="checkbox"></label>
      </div>
    </div>
  </div>
</div>

<div class="panel out">
  <div class="topbar">
    <button id="playPreview" class="primary">播放預覽</button>
    <button id="stopPreview">停止預覽</button>
    <button id="record" class="success">一鍵匯出 WebM</button>
  </div>
  <canvas id="canvas" width="1280" height="720"></canvas>
  <a id="download" class="hidden" download="joined-video.webm">下載匯出的影片</a>
  <div class="small">操作：上傳兩段影片 → 用 X/Y/寬/高 調整裁切區域 → 選左右或上下拼接 → 播放預覽 → 匯出 WebM。瀏覽器原生輸出通常是 WebM，不是 MP4。</div>
</div>

  </div>  <script>
    const $=id=>document.getElementById(id);
    const videoA=$('videoA'), videoB=$('videoB'), canvas=$('canvas'), ctx=canvas.getContext('2d');
    const download=$('download');
    let raf=null, recorder=null, chunks=[];

    function waitForVideoReady(video){
      return new Promise((resolve,reject)=>{
        if(video.readyState>=2 && video.videoWidth>0 && video.videoHeight>0){
          resolve();
          return;
        }
        const done=()=>{ cleanup(); resolve(); };
        const fail=()=>{ cleanup(); reject(new Error('影片讀取失敗或瀏覽器不支援此格式')); };
        const cleanup=()=>{
          video.removeEventListener('loadeddata',done);
          video.removeEventListener('loadedmetadata',done);
          video.removeEventListener('error',fail);
        };
        video.addEventListener('loadeddata',done,{once:true});
        video.addEventListener('loadedmetadata',done,{once:true});
        video.addEventListener('error',fail,{once:true});
      });
    }

    function loadVideo(fileInput, video){
      fileInput.addEventListener('change',async()=>{
        const file=fileInput.files?.[0];
        if(!file) return;
        if(video.dataset.url) URL.revokeObjectURL(video.dataset.url);
        const url=URL.createObjectURL(file);
        video.dataset.url=url;
        video.src=url;
        video.muted=true;
        video.playsInline=true;
        video.preload='auto';
        video.load();
        try{
          await waitForVideoReady(video);
          try{ video.currentTime=Math.min(0.05, video.duration || 0); }catch(e){}
          drawOnce();
        }catch(err){
          alert(err.message || '影片讀取失敗');
        }
      });
    }
    loadVideo($('fileA'),videoA); loadVideo($('fileB'),videoB);

    function getCrop(prefix, video){
      const vw=Math.max(1, video.videoWidth || 1);
      const vh=Math.max(1, video.videoHeight || 1);

      let x=Number($(prefix+'x').value)/100;
      let y=Number($(prefix+'y').value)/100;
      let w=Number($(prefix+'w').value)/100;
      let h=Number($(prefix+'h').value)/100;

      x=Math.max(0,Math.min(0.99,x));
      y=Math.max(0,Math.min(0.99,y));
      w=Math.max(0.01,Math.min(1-x,w));
      h=Math.max(0.01,Math.min(1-y,h));

      return {
        sx:x*vw,
        sy:y*vh,
        sw:Math.max(1,w*vw),
        sh:Math.max(1,h*vh)
      };
    }

    function getCropAspect(crop){
      return crop.sw / crop.sh;
    }

    function setupCanvas(){
      const mode=$('mode').value;

      if(videoA.readyState < 1 || videoB.readyState < 1){
        canvas.width=1280;
        canvas.height=720;
        return;
      }

      const ca=getCrop('a',videoA);
      const cb=getCrop('b',videoB);

      const aspectA=Math.max(0.01, getCropAspect(ca) || 1);
      const aspectB=Math.max(0.01, getCropAspect(cb) || 1);

      if(mode==='horizontal'){
        const h=720;
        const wA=Math.round(h*aspectA);
        const wB=Math.round(h*aspectB);
        canvas.width=Math.max(2,wA+wB);
        canvas.height=h;
      }else{
        const w=720;
        const hA=Math.round(w/aspectA);
        const hB=Math.round(w/aspectB);
        canvas.width=w;
        canvas.height=Math.max(2,hA+hB);
      }
    }

    function fitCropToBox(crop, destW, destH){
      return crop;
    }

    function drawVideoCover(video,crop,dx,dy,dw,dh,flipH,flipV){
      if(video.readyState<2) return;
      const c=fitCropToBox(crop,dw,dh);
      ctx.save();
      ctx.translate(dx + (flipH ? dw : 0), dy + (flipV ? dh : 0));
      ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
      ctx.drawImage(video, c.sx,c.sy,c.sw,c.sh, 0,0,dw,dh);
      ctx.restore();
    }

    function drawFrame(){
      setupCanvas();
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
      const mode=$('mode').value;
      const ca=getCrop('a',videoA), cb=getCrop('b',videoB);
      const aspectA=ca.sw/ca.sh || 1;
      const aspectB=cb.sw/cb.sh || 1;

      if(mode==='horizontal'){
        const h=canvas.height;
        const wA=Math.round(h*aspectA);
        const wB=Math.round(h*aspectB);
        drawVideoCover(videoA, ca, 0,0,wA,h, $('afh').checked, $('afv').checked);
        drawVideoCover(videoB, cb, wA,0,wB,h, $('bfh').checked, $('bfv').checked);
      }else{
        const w=canvas.width;
        const hA=Math.round(w/aspectA);
        const hB=Math.round(w/aspectB);
        drawVideoCover(videoA, ca, 0,0,w,hA, $('afh').checked, $('afv').checked);
        drawVideoCover(videoB, cb, 0,hA,w,hB, $('bfh').checked, $('bfv').checked);
      }
    }

    function drawOnce(){
      cancelAnimationFrame(raf);
      drawFrame();
    }

    function draw(){
      drawFrame();
      raf=requestAnimationFrame(draw);
    }

    async function playBoth(){
      await Promise.all([waitForVideoReady(videoA), waitForVideoReady(videoB)]);
      videoA.currentTime=0; videoB.currentTime=0;
      await Promise.allSettled([videoA.play(),videoB.play()]);
      cancelAnimationFrame(raf); draw();
    }
    function stopBoth(){
      videoA.pause(); videoB.pause(); cancelAnimationFrame(raf); raf=null;
    }

    $('playPreview').addEventListener('click',playBoth);
    $('stopPreview').addEventListener('click',stopBoth);

    $('record').addEventListener('click',async()=>{
      if(!videoA.src || !videoB.src){
        alert('請先上傳兩個影片');
        return;
      }

      try{
        await Promise.all([waitForVideoReady(videoA), waitForVideoReady(videoB)]);
      }catch(err){
        alert(err.message || '影片尚未準備好');
        return;
      }

      download.classList.add('hidden');
      download.removeAttribute('href');
      chunks=[];
      setupCanvas();

      const fps=Math.max(10,Math.min(60,Number($('fps').value)||30));
      const stream=canvas.captureStream(fps);

      recorder=new MediaRecorder(stream,{mimeType:'video/webm'});

      recorder.ondataavailable=e=>{
        if(e.data.size) chunks.push(e.data);
      };

      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        download.href=URL.createObjectURL(blob);
        download.classList.remove('hidden');
        download.textContent='下載匯出的影片';
      };

      videoA.pause();
      videoB.pause();
      videoA.currentTime=0;
      videoB.currentTime=0;

      const minDuration=Math.min(
        isFinite(videoA.duration)?videoA.duration:0,
        isFinite(videoB.duration)?videoB.duration:0
      );

      recorder.start();

      cancelAnimationFrame(raf);
      draw();

      await Promise.allSettled([
        videoA.play(),
        videoB.play()
      ]);

      setTimeout(()=>{
        if(recorder && recorder.state!=='inactive'){
          recorder.stop();
        }
        stopBoth();
      }, Math.max(0.1,minDuration)*1000);
    });
      recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        download.href=URL.createObjectURL(blob);
        download.classList.remove('hidden');
        download.textContent='下載匯出的影片';
      };
      recorder.start();
      await playBoth();
    });

    

    ['ax','ay','aw','ah','afh','afv','bx','by','bw','bh','bfh','bfv','mode'].forEach(id=>$(id).addEventListener('input',()=>{ drawOnce(); }));
    setupCanvas(); drawOnce();
  </script></body>
</html>
