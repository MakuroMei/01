<!doctype html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>上下鏡像拼接工具</title>
  <style>
    :root{--bg:#0f1117;--panel:#171b23;--panel2:#1e2430;--border:#2a3242;--text:#eef2ff;--muted:#9aa4bd;--green:#10b981;--blue:#3b82f6}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .wrap{max-width:900px;margin:0 auto;padding:14px;display:grid;gap:14px}
    .panel{background:var(--panel);border:1px solid var(--border);padding:12px;display:grid;gap:12px}
    label{font-size:14px;color:var(--muted);display:grid;gap:8px}
    input,button{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:12px;font-size:16px}
    button{cursor:pointer;font-weight:800}.primary{background:var(--blue)}.success{background:var(--green)}
    video,canvas{width:100%;background:#000;display:block;border:1px solid var(--border)}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .small{font-size:12px;color:var(--muted);line-height:1.6}
    .hidden{display:none}
    a{display:block;text-align:center;background:var(--green);color:white;text-decoration:none;padding:12px;font-weight:800;border:1px solid var(--border)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <label>選擇影片
        <input id="file" type="file" accept="video/*">
      </label>
      <video id="video" controls muted playsinline preload="auto"></video>
    </div><div class="panel">
  <div class="buttons">
    <button id="preview" class="primary">播放預覽</button>
    <button id="export" class="success">一鍵匯出 WebM</button>
  </div>
  <canvas id="canvas" width="720" height="1280"></canvas>
  <a id="download" class="hidden" download="mirror-stack.webm">下載匯出的影片</a>
  <div class="small">
    固定處理方式：同一影片上下拼接。上方片段會左右鏡像＋上下鏡像；下方片段保持原樣。兩段都固定裁掉上方 7.66%，其餘保留。
  </div>
</div>

  </div>  <script>
    const file=document.getElementById('file');
    const video=document.getElementById('video');
    const canvas=document.getElementById('canvas');
    const ctx=canvas.getContext('2d');
    const download=document.getElementById('download');
    const previewBtn=document.getElementById('preview');
    const exportBtn=document.getElementById('export');

    const CROP_Y_PERCENT=7.66;
    let raf=null;
    let recorder=null;
    let chunks=[];

    function stopLoop(){
      if(raf) cancelAnimationFrame(raf);
      raf=null;
    }

    function setupCanvas(){
      const vw=video.videoWidth || 1280;
      const vh=video.videoHeight || 720;
      const sy=vh*(CROP_Y_PERCENT/100);
      const sh=vh-sy;
      const aspect=vw/sh;
      const outW=720;
      const oneH=Math.round(outW/aspect);
      canvas.width=outW;
      canvas.height=oneH*2;
    }

    function drawSegment(flip){
      const vw=video.videoWidth || 1;
      const vh=video.videoHeight || 1;
      const sy=vh*(CROP_Y_PERCENT/100);
      const sh=vh-sy;
      const w=canvas.width;
      const h=canvas.height/2;
      const y=flip ? 0 : h;

      ctx.save();
      ctx.beginPath();
      ctx.rect(0,y,w,h);
      ctx.clip();

      if(flip){
        ctx.translate(w,h);
        ctx.scale(-1,-1);
        ctx.drawImage(video,0,sy,vw,sh,0,0,w,h);
      }else{
        ctx.drawImage(video,0,sy,vw,sh,0,y,w,h);
      }

      ctx.restore();
    }

    function drawFrame(){
      setupCanvas();
      ctx.fillStyle='#000';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      if(video.readyState>=2){
        drawSegment(true);
        drawSegment(false);
      }
    }

    function loop(){
      drawFrame();
      raf=requestAnimationFrame(loop);
    }

    file.addEventListener('change',()=>{
      const selected=file.files && file.files[0];
      if(!selected) return;
      if(video.dataset.url) URL.revokeObjectURL(video.dataset.url);
      const url=URL.createObjectURL(selected);
      video.dataset.url=url;
      video.src=url;
      video.load();
      download.classList.add('hidden');
      video.onloadedmetadata=()=>{
        try{ video.currentTime=0.05; }catch(e){}
        drawFrame();
      };
      video.onloadeddata=()=>drawFrame();
      video.onerror=()=>alert('影片讀取失敗：瀏覽器可能不支援這個影片編碼');
    });

    previewBtn.addEventListener('click',async()=>{
      if(!video.src){ alert('請先選擇影片'); return; }
      video.currentTime=0;
      stopLoop();
      await video.play().catch(()=>{});
      loop();
    });

    exportBtn.addEventListener('click',async()=>{
      if(!video.src){ alert('請先選擇影片'); return; }
      download.classList.add('hidden');
      download.removeAttribute('href');
      chunks=[];
      stopLoop();
      video.pause();
      video.currentTime=0;
      setupCanvas();
      drawFrame();

      const stream=canvas.captureStream(30);
      recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
      recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        download.href=URL.createObjectURL(blob);
        download.classList.remove('hidden');
        download.textContent='下載匯出的影片';
      };

      recorder.start();
      await video.play().catch(()=>{});
      loop();

      const duration=isFinite(video.duration) ? video.duration : 0;
      setTimeout(()=>{
        if(recorder && recorder.state!=='inactive') recorder.stop();
        video.pause();
        stopLoop();
        drawFrame();
      }, Math.max(0.1,duration)*1000);
    });

    setupCanvas();
    drawFrame();
  </script></body>
</html>
